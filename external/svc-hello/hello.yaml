# svc-hello's external route: https://hello.ref.thecloudgeek.io (ADR-0021 §2).
#
# The folder this file sits in is the only thing that says how exposed it is:
# external/ means the external Gateway, the public zone and the Cloud Armor
# policy. There is no `exposure` field, and a file that carries one, or
# `system` or `route`, is refused (scripts/check_routes.py). The System is the
# folder's name, the route's name is this file's.
#
# Everything under external/ needs an approval from the `security` team before
# it merges (ADR-0021 §10).
host: hello
service: svc-hello
# The Service's own port: k8s/service.yaml in svc-hello maps 80 to the
# container's named port.
port: 80
